<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    body{font-family:"Inter",sans-serif;background:#f9fafb;color:#111827;}
    .container-lg{max-width:960px;}
    .book-cover{width:100%;max-width:300px;border-radius:.75rem;box-shadow:0 4px 12px rgba(0,0,0,.1);}
    .download-btn,.read-btn{padding:.6rem 1.2rem;border-radius:.45rem;border:1px solid var(--accent,#a91938);color:var(--accent,#a91938);background:transparent;transition:.25s;display:inline-flex;align-items:center;justify-content:center;}
    .download-btn:hover,.read-btn:hover{background:var(--accent,#a91938);color:#fff;}
    /* Stack buttons and make them full-width on extra-small screens */
    @media (max-width: 575.98px) {
      .read-btn,
      .download-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container-lg py-5">
    <a class="download-btn d-inline-flex align-items-center gap-2 mb-4" href="books.html"><i class="fas fa-arrow-left"></i><span>Back to books</span></a>
    <div id="bookContainer" class="d-flex flex-column flex-md-row gap-4">
      <!-- Cover -->
      <img id="coverImg" class="book-cover" alt />
      <!-- Info -->
      <div>
        <h2 id="title" class="h3 mb-2"></h2>
        <p id="author" class="text-muted mb-3"></p>
        <p id="description"></p>
        <p class="mt-3"><span class="fw-semibold">Rating:</span> <span id="rating"></span></p>
        <!-- Responsive action buttons: stack on xs, inline from sm → up -->
        <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
          <a id="downloadBtn" class="download-btn w-100 w-sm-auto" download>Download PDF</a>
        </div>
      </div>
    </div>
    <!-- Embedded PDF viewer -->
    <div class="mt-5">
      <iframe id="pdfFrame" class="w-100" style="border:1px solid #e5e7eb;border-radius:.5rem;min-height:60vh;" title="PDF viewer"></iframe>
    </div>
  </div>
  <script src="books.js"></script>
  <script>
    function qs(name){return new URLSearchParams(location.search).get(name);}
    const id = qs('id');
    const book = window.getBookById ? getBookById(id) : null;
    if(!book){document.body.innerHTML='<div class="container py-5"><h3>Book not found</h3></div>';throw new Error('Book not found');}
    document.getElementById('coverImg').src = book.cover;
    document.getElementById('coverImg').alt = 'Cover of '+book.title;
    document.getElementById('title').textContent = book.title;
    document.getElementById('author').textContent = book.author;
    document.getElementById('description').textContent = book.description;
    document.getElementById('rating').textContent = book.rating;
    // Set iframe source to display the PDF in-page
    document.getElementById('pdfFrame').src = book.pdf;
    const dl = document.getElementById('downloadBtn');
    dl.href = book.pdf;
    dl.setAttribute('download', book.title.replace(/\s+/g,'_')+'.pdf');
  </script>
</body>
</html>
